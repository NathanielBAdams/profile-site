version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 needs Node 22.12 or newer. The app builds on the Amazon
        # Linux 2023 image (_CUSTOM_IMAGE=amplify:al2023), which runs it.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
