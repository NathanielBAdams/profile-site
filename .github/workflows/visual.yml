# Desktop screenshot tests. Every push to a pull request re-photographs the
# desktop pages and compares them to the approved baselines in
# tests/visual/__screenshots__. On a failure, the report with the differing
# images is attached to the run. (Deploys are separate: Amplify builds main.)
name: Desktop screenshots

on:
  pull_request:
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test
        env:
          CI: 'true'
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
