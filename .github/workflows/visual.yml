# Desktop screenshot tests. Every push to a pull request re-photographs the
# desktop pages and compares them with the approved baselines in
# tests/visual/__screenshots__/ci. If anything differs, a comment on the pull
# request lists what changed, and the full report (with the differing images)
# is attached to the run.
#
# To approve an intentional desktop change, either put [baselines] in the
# commit message (the run then takes new images instead of failing), or run
# this workflow by hand on the branch with "update baselines" checked. Either
# way it commits the new images with [skip ci], so that commit starts no run.
# (Deploys are separate: Amplify builds main.)
name: Desktop screenshots

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Update baselines (approve the current desktop look)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Choose compare or update
        id: mode
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ inputs.update }}" = "true" ] || git log -1 --format=%B | grep -qF '[baselines]'; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baselines
        if: ${{ steps.mode.outputs.update != 'true' }}
        run: npx playwright test

      - name: Update baselines
        if: ${{ steps.mode.outputs.update == 'true' }}
        run: |
          npx playwright test --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/ci
          git diff --cached --quiet || git commit -m "Update desktop screenshot baselines (CI) [skip ci]"
          git push

      - name: Comment what changed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let lines = [];
            try {
              const r = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
              const walk = (s) => {
                for (const spec of s.specs ?? []) {
                  for (const t of spec.tests) {
                    const res = t.results.at(-1);
                    if (res && res.status !== 'passed') {
                      const msg = (res.error?.message ?? '').replace(/\u001b\[[0-9;]*m/g, '').split('\n').find((l) => /pixels|ratio|size/i.test(l)) ?? res.status;
                      lines.push(`- **${spec.title}**: ${msg.trim()}`);
                    }
                  }
                }
                (s.suites ?? []).forEach(walk);
              };
              r.suites.forEach(walk);
            } catch (e) {
              lines.push(`(Could not read the results: ${e.message})`);
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `**Desktop screenshots changed** in ${lines.length} test(s):\n\n${lines.join('\n')}\n\nThe report with the differing images is attached to [the run](${run}).`,
            });

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
